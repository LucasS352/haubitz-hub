# =============================================
# HAUBITZ - ORQUESTRADOR GERAL DE PRODUÇÃO
# =============================================
version: '3.8'

services:
  # ----------------------------------------
  # BANCO DE DADOS MariaDB
  # ----------------------------------------
  db:
    image: mariadb:10.11
    container_name: haubitz_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: HaubitzRoot2024
      MYSQL_DATABASE: haubitz
      MYSQL_USER: haubitz_user
      MYSQL_PASSWORD: HaubitzDB2024
    volumes:
      - haubitz_db_data:/var/lib/mysql
    networks:
      - haubitz_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pHaubitzRoot2024"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------
  # BACKEND (Node.js API)
  # ----------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: haubitz_backend
    restart: unless-stopped
    ports:
      - "3540:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://haubitz_user:HaubitzDB2024@db:3306/haubitz
      JWT_SECRET: haubitz-jwt-secret-2024-change-this-in-prod
      JWT_REFRESH_SECRET: haubitz-refresh-secret-2024-change-this-in-prod
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_ROUNDS: 12
      ADMIN_EMAIL: kayke@haubitz.com.br
      ADMIN_PASSWORD: Haubitz@2024!
      ADMIN_NAME: Kayke
    depends_on:
      db:
        condition: service_healthy
    networks:
      - haubitz_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ----------------------------------------
  # HAUBITZ HUB (Painel Interno)
  # ----------------------------------------
  haubitz-hub:
    build:
      context: ./haubitz-hub
      dockerfile: Dockerfile
    container_name: haubitz_hub
    restart: unless-stopped
    ports:
      - "3541:80"
    depends_on:
      - backend
    networks:
      - haubitz_network

  # ----------------------------------------
  # PORTAL DO CLIENTE
  # ----------------------------------------
  cliente-portal:
    build:
      context: ./cliente-portal
      dockerfile: Dockerfile
    container_name: haubitz_portal
    restart: unless-stopped
    ports:
      - "3542:80"
    depends_on:
      - backend
    networks:
      - haubitz_network

volumes:
  haubitz_db_data:
    driver: local

networks:
  haubitz_network:
    driver: bridge
