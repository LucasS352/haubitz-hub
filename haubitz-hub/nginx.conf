server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Aumenta limite de upload para 20MB (padrão do Nginx é 1MB)
    client_max_body_size 20M;

    # Proxy para a API do backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        # Timeout maior para uploads
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # Proxy para arquivos estáticos (imagens/documentos enviados pelos usuários)
    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;

        # Cache de 1 hora para arquivos estáticos
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600";
    }

    # SPA routing — tudo que não for arquivo vai para o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
