services:
  - type: web
    name: haubitz-backend
    env: node
    region: ohio          # us-east-1 — mais perto do BR entre as opções gratuitas
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && node -e "require('./dist/prisma/seed.js').default?.().catch(()=>{})" ; npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: haubitz-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: BCRYPT_ROUNDS
        value: 12
      # ⚠️ Preencha estes no dashboard do Render após criar o serviço:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        value: kayke@haubitz.com.br
      - key: ADMIN_NAME
        value: Kayke
      # ADMIN_PASSWORD: defina manualmente no dashboard (não colocar aqui por segurança)

databases:
  - name: haubitz-db
    plan: free
    region: ohio
